<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ok buddy</title>
    <link rel="stylesheet" type="text/css" href="options.css" />
    <script defer src="options.js"></script>
  </head>
  <body>
    <form id="settings-form">
      <h1>settings</h1>
      <h2>rules</h2>
      <p>enter the phrases you want to allow or deny, one phrase per line.</p>
      <h3>yes, please:</h3>
      <textarea
        name="yay-rules-input"
        draggable="false"
        rows="5"
      ></textarea>
      <h3>no, thank you:</h3>
      <textarea
        name="nay-rules-input"
        draggable="false"
        rows="5"
      ></textarea>
      <h3>hmm, idk:</h3>
      <textarea
        name="meh-rules-input"
        draggable="false"
        rows="5"
      ></textarea>
      <button type="button" id="save-button">save</button>
    </form>
  </body>
</html>
