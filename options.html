<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ok buddy</title>
    <link rel="stylesheet" type="text/css" href="options.css" />
    <script defer src="options.js"></script>
  </head>
  <body>
    <form id="settings-form">
      <h1>settings</h1>
      <h2>rules</h2>
      <p>enter the phrases you want to scan for, one phrase per line.</p>
      <label class="yay">
        yes, please:
        <textarea
                name="yay-rules-input"
                draggable="false"
                rows="5"
        ></textarea>
      </label>
      <label class="meh">
        hmm, idk:
        <textarea
                name="meh-rules-input"
                draggable="false"
                rows="5"
        ></textarea>
      </label>
      <label class="nay">
        no, thank you:
        <textarea
                name="nay-rules-input"
                draggable="false"
                rows="5"
        ></textarea>
      </label>
      <button type="button" id="save-button">🖫</button>
    </form>
  </body>
</html>
